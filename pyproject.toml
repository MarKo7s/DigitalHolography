[project]
name = "pyDigHolo"
version = "0.1.0"
description = "Python engine for Joel Carpenter's digHolo library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
]

[project.urls]
Repository = "https://github.com/MarKo7s/DigitalHolography"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pyDigHolo"]

[tool.setuptools.package-data]
pyDigHolo = ["digHolo_v1.0.0/bin/Win64/*"]
